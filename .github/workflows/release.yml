name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package release archive
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $outDir = "dist"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $zipPath = Join-Path $outDir "rustdesk-desktop-switch-$tag.zip"
          Compress-Archive -Path `
            "rustdesk_desktop_switch.ahk", `
            "rd_switch_worker.ahk", `
            "README.md", `
            "CHANGELOG.md", `
            "LICENSE" `
            -DestinationPath $zipPath -Force
          Get-FileHash -Algorithm SHA256 $zipPath | ForEach-Object {
            "$($_.Hash.ToLower())  $(Split-Path -Leaf $zipPath)" | Out-File -Encoding ascii "$zipPath.sha256"
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.sha256
